# Reference workflow for `mezz pr-report` (MCP-008).
#
# Posts mezz's structural change report as a single PR comment, edited in
# place on every push (found by the `<!-- mezz-pr-report -->` marker the
# command emits). Non-blocking by design: every step swallows failure so
# this never gates a merge — mezz is a signal, not a gate.
#
# Copy this into a consuming repo's `.github/workflows/`. It assumes the
# `mezz` binary is installed via `cargo install`; swap in a released
# binary or a container image if you have one.
name: mezz pr-report

on:
  pull_request:

# Least privilege: only needs to read the code and write PR comments.
permissions:
  contents: read
  pull-requests: write

# One in-flight run per PR; a newer push cancels the older report job.
concurrency:
  group: mezz-pr-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-report:
    name: structural change report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base with the target branch resolves.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mezz
        run: cargo install --path . --bin mezz
        continue-on-error: true

      - name: Compute merge-base and render report
        id: report
        continue-on-error: true
        run: |
          BASE="$(git merge-base origin/${{ github.base_ref }} HEAD)"
          echo "Comparing working tree against merge-base $BASE" >&2
          # `pr-report` always exits 0; base_ref is the merge-base so the
          # diff is exactly the PR's own changes, not the branch's drift.
          mezz pr-report --base-ref "$BASE" > report.md
          {
            echo 'body<<MEZZ_EOF'
            cat report.md
            echo 'MEZZ_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert the PR comment
        if: steps.report.outputs.body != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- mezz-pr-report -->';
            const body = process.env.MEZZ_BODY;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          MEZZ_BODY: ${{ steps.report.outputs.body }}

    # Job-level guard: even if a step's continue-on-error is removed later,
    # the workflow itself is advisory. Keep the final status green.
    continue-on-error: true

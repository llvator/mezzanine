[package]
name = "mezzanine"
version = "1.5.0"
edition = "2021"
description = "Visualize code relationships, dependencies, and quality metrics"
authors = ["llvator"]
# Dual-licensed: AGPL for everyone, commercial terms for organisations that
# cannot take it. SPDX `OR` is the accurate spelling — the user chooses.
# See COMMERCIAL.md.
license = "AGPL-3.0-only OR LicenseRef-Commercial"
homepage = "https://llvator.com"
repository = "https://github.com/llvator/mezzanine"

# The package is `mezzanine` on crates.io — the full word, because that is
# what a listing has to carry. The library and the binary are `mezz`, because
# that is what a person types and what every `use` in this repo says. Naming
# the lib target explicitly is what keeps those two facts from contradicting
# each other.
[lib]
name = "mezz"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Graph data structures
petgraph = "0.6"

# Code parsing
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-java = "0.21"
tree-sitter-go = "0.21"
tree-sitter-kotlin = "0.3"
# C and C++ share one grammar here. tree-sitter-cpp is pinned to the 0.22
# line because 0.23+ exposes the language as a `tree_sitter_language::LanguageFn`
# that only converts to `tree_sitter::Language` in tree-sitter 0.23+, the same
# wall the Groovy note below describes. C++ is a superset of C for everything
# `parser/cpp` reads, so `.c` files are parsed by it too — see that module's doc.
tree-sitter-cpp = "0.22"
# Groovy grammar — pulled in for the C parser symbol; the published Rust
# bindings expose the language as a `tree_sitter_language::LanguageFn`,
# which only converts to `tree_sitter::Language` in tree-sitter 0.23+.
# Our `parser/groovy/mod.rs` calls the underlying C function via the
# `LanguageFn::into_raw` accessor and transmutes the result, avoiding
# the need to bump every other parser to a new tree-sitter version.
tree-sitter-groovy = "0.1"
# Dart has no crates.io entry here on purpose. Every published
# `tree-sitter-dart` carrying Dart 3 is built at grammar ABI 15, which our
# tree-sitter 0.22 rejects outright, and the newest ABI-14 release predates
# Dart 3 entirely. So the grammar is vendored at `vendor/tree-sitter-dart/`,
# regenerated from upstream at ABI 14 and compiled by `build.rs`. That
# directory's README carries the full reasoning.

# SQL DDL (SQL-001). Not tree-sitter: `.sql` schemas are parsed for topology,
# not for control flow, and sqlparser yields a typed DDL AST rather than a tree
# to hand-walk. It is all-or-nothing per statement, unlike the error-tolerant
# tree-sitter grammars, which is why `parser/sql/lexer.rs` splits a file into
# statements first so one unsupported statement cannot cost the whole file.
sqlparser = "0.62"

# Serialization & Output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Compression for `mezz serve`'s analysis snapshots (SRV-006). The snapshot
# JSON is ~42% entity-ID strings sharing one long repeated prefix, which
# zstd removes almost entirely — measured 31x on tinygrad at level 3, for
# 0.14s to write and 0.12s to read. Kept over a binary format because
# serde_json + #[serde(default)] survives adding a field to CodeEntity,
# which a positional encoding would not.
zstd = "0.13"

# Content hashing for the on-disk parse store (AN-003). Cryptographic
# strength matters here: the hash is the cache key, so a collision would
# serve a wrong parse. blake3 is fast and collision-resistant.
blake3 = "1.5"

# File handling
walkdir = "2.4"
ignore = "0.4"
glob = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime (required for watch/serve command)
tokio = { version = "1.35", features = ["full"] }

# HTTP server + SSE for the watch command
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Filesystem watcher for live reload
notify = "7"
notify-debouncer-mini = "0.5"

# SSE stream helpers
async-stream = "0.3"
futures-core = "0.3"

# Colors for terminal output
colored = "2.1"

# Progress bars
indicatif = "0.17"

# Terminal dashboard for `mezz monitor` (MON-001). Pure Rust and small —
# ratatui, its crossterm backend and a couple of unicode-width crates — so it
# is built by default rather than hidden behind a feature: a command that
# exists or not depending on how the binary was installed is a support trap.
# Crossterm is used through `ratatui::crossterm`, so the two versions cannot
# drift apart.
ratatui = "0.29"

# Parallel processing
rayon = "1.10"

# `build.rs` fingerprints the parser sources so the parse store's cache
# generation is derived rather than hand-bumped — see the script's header.
# Same hash the store uses at runtime, so the two agree by construction.
[build-dependencies]
# Compiles the vendored Dart grammar (see vendor/tree-sitter-dart/README.md).
cc = "1.0"
blake3 = "1.5"

# `ServiceExt::oneshot` drives a `Router` in-process, so the CORS and token
# tests exercise the real layer stack without binding a port.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Tests only. `mezz init --editor-tools` writes a VS Code problem matcher
# whose regex is tied to the row `quality` prints, and the only way to keep
# the two from drifting apart silently is to run the one against samples of
# the other. Already in the tree as a transitive dependency.
regex = "1"

[features]
default = []

[[bin]]
name = "mezz"
path = "src/main.rs"

# Standalone CLI for the Elevator (`.elv`) spec language. Same parser
# and renderer as `mezz analyze -l elevator -f elevator-text`, but with
# a focused command line for users who only care about the spec, not
# Mezzanine's full code-visualisation surface.
[[bin]]
name = "elevator"
path = "src/bin/elevator.rs"

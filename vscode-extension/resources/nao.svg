<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.35"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- Hull: shallow curved trapezoid, wider at top -->
  <path d="M3.3 16.2 L5.5 19.2 L18.5 19.2 L20.7 16.2 Z"/>

  <!-- Main mast -->
  <line x1="12" y1="3.2" x2="12" y2="16.2"/>
  <!-- Main yard (horizontal spar) -->
  <line x1="7.5" y1="7.2" x2="16.5" y2="7.2"/>
  <!-- Upper yard -->
  <line x1="9.5" y1="4.5" x2="14.5" y2="4.5"/>

  <!-- Main sail: square, billowed outward on both sides like wind-filled -->
  <path d="M7.8 7.3 C 9 10, 9 13, 7.8 15.6 L16.2 15.6 C 15 13, 15 10, 16.2 7.3 Z"/>
  <!-- Upper (top) sail, smaller -->
  <path d="M9.7 4.6 C 10.4 5.6, 10.4 6.4, 9.7 7.2 L14.3 7.2 C 13.6 6.4, 13.6 5.6, 14.3 4.6 Z"/>

  <!-- Pennant flag at the masthead -->
  <path d="M12 3 L14.8 3.7 L12 4.4"/>

  <!-- Waves beneath -->
  <path d="M2.2 21.4 q1.8 -1.2 3.6 0 t3.6 0 t3.6 0 t3.6 0 t3.6 0"/>
</svg>

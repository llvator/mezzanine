<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     fill="none" stroke="currentColor"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- The mezzanine: a rail you stand behind, on a floor plate. Weights are
       heavier than the tile's because this renders at 24 actual pixels in the
       activity bar, where a sub-pixel stroke disappears. -->
  <line x1="4.6" y1="4.2" x2="19.4" y2="4.2" stroke-width="1.2"/>
  <line x1="6.2" y1="4.2" x2="6.2" y2="7.4" stroke-width="1.2"/>
  <line x1="17.8" y1="4.2" x2="17.8" y2="7.4" stroke-width="1.2"/>
  <line x1="2.6" y1="8.4" x2="21.4" y2="8.4" stroke-width="2.2"/>

  <!-- The structure below, seen from it. Deliberately not attached to the
       plate: it is what you are looking at, not what hangs from you. -->
  <line x1="10.9" y1="13.4" x2="8.2" y2="15.2" stroke-width="1.4"/>
  <line x1="13.1" y1="13.4" x2="15.8" y2="15.2" stroke-width="1.4"/>
  <line x1="7.9" y1="17.7" x2="9.5" y2="19.5" stroke-width="1.4"/>
  <circle cx="12" cy="12.4" r="1.75" fill="currentColor" stroke="none"/>
  <circle cx="7.1" cy="16.2" r="1.75" fill="currentColor" stroke="none"/>
  <circle cx="16.9" cy="16.2" r="1.75" fill="currentColor" stroke="none"/>
  <circle cx="10.3" cy="20.4" r="1.75" fill="currentColor" stroke="none"/>
</svg>
